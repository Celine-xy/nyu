<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A deployment smoke test for the AI News Assistant project."
    />
    <title>AI News Assistant | Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
    <link rel="stylesheet" href="style.css" />

  <body>
    <main class="smoke-test" aria-labelledby="headline">
      <p class="eyebrow"><span aria-hidden="true">●</span> Live signal detected</p>

      <p class="status">Codex <span aria-hidden="true">→</span> GitHub <span aria-hidden="true">→</span> Vercel: <strong>ALIVE</strong></p>
      <div class="ticker" aria-hidden="true">
        <span>DEPLOYMENT CONFIRMED</span>
        <span>•</span>
        <span>THE INTERNET HAS BEEN INFORMED</span>
        <span>•</span>
        <span>DEPLOYMENT CONFIRMED</span>
      </div>
    </main>
  </body>
</html>
